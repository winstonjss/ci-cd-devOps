apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: java-microservice-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/juansebastian-br/JavaCICDTesting.git
    targetRevision: main
    path: helm/java-microservice
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

